version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "CI"
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"
    cooldown:
      default-days: 7
