name: Build deb package

on:
  push:
    tags:
      - 'v*'
      - '1.*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    name: "deb"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            devscripts \
            debhelper-compat \
            meson \
            ninja-build \
            python3 \
            python3-gi \
            pkg-config \
            libglib2.0-dev \
            appstream \
            libadwaita-1-dev \
            python3-dev \
            python3-gi \
            blueprint-compiler \
            gettext \
            desktop-file-utils \
            build-essential

      - name: Download upstream source
        run: |
          git clone --depth 1 --branch 1.16.2 https://github.com/Huluti/Curtail.git curtail-src

      - name: Prepare debian directory
        run: |
          cp -r debian curtail-src/

      - name: Build Debian package
        run: |
          cd curtail-src
          debuild -us -uc -b

      - name: Copy .deb to workspace
        run: |
          cp ../curtail_*.deb .

      - name: Upload Debian artifact
        uses: actions/upload-artifact@v4
        with:
          name: curtail-deb
          path: curtail_*.deb

      - name: Release Debian package
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: curtail_*.deb
          body_path: release_notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-notes:
    name: "Generate Release Notes"
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "# Curtail $TAG" > release_notes.md
          echo "" >> release_notes.md
          echo "Image compressor for PNG, JPEG, WebP, and SVG." >> release_notes.md
          echo "" >> release_notes.md
          echo "## Installation" >> release_notes.md
          echo "" >> release_notes.md
          echo "### AppImage (Universal)" >> release_notes.md
          echo "\`\`\`bash" >> release_notes.md
          echo "chmod +x curtail-x86_64.AppImage" >> release_notes.md
          echo "./curtail-x86_64.AppImage" >> release_notes.md
          echo "\`\`\`" >> release_notes.md
          echo "" >> release_notes.md
          echo "### Debian/Ubuntu" >> release_notes.md
          echo "\`\`\`bash" >> release_notes.md
          echo "sudo dpkg -i curtail_*.deb" >> release_notes.md
          echo "sudo apt-get install -f" >> release_notes.md
          echo "\`\`\`" >> release_notes.md
          echo "" >> release_notes.md
          echo "## Required Dependencies (all formats)" >> release_notes.md
          echo "- oxipng (PNG)" >> release_notes.md
          echo "- pngquant (PNG)" >> release_notes.md
          echo "- jpegoptim (JPEG)" >> release_notes.md
          echo "- webp (WebP)" >> release_notes.md
          echo "- scour (SVG)" >> release_notes.md
          echo "" >> release_notes.md
          echo "Install with: \`sudo apt install oxipng pngquant jpegoptim webp scour\`" >> release_notes.md

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release_notes.md